<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SoloQ Challenge - Valorant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Montserrat"', 'sans-serif'] },
          colors: {
            bg: '#08080b', panel: '#0f0f15', panel2: '#131319', line: '#1e1e27',
            ink: '#f2f2f5', dim: '#8b8b96',
            gold: '#f2c14e', silver: '#c7d0da', bronze: '#d9884b',
            purple: '#8b6ef2', win: '#38c98e', loss: '#ef5761', valRed: '#ff4655'
          },
          keyframes: {
            glow: { '0%,100%': { opacity: 0.6 }, '50%': { opacity: 1 } },
          },
          animation: {
            glow: 'glow 3.5s ease-in-out infinite',
          },
        },
      },
    };
  </script>
</head>
<body
  class="min-h-screen font-sans text-ink px-5 pt-7 pb-16 bg-cover bg-top"
  style="
    background-color: #08080b;
    background-image: url('https://res.cloudinary.com/dmsvwqdi2/image/upload/v1786060742/atest_ykofwz.jpg');
  ">
<div class="max-w-[1180px] mx-auto">

  <header class="flex items-end justify-between flex-wrap gap-4 mb-8 pb-5 border-b border-line">
    <div class="flex gap-2"> 
      <img src="https://res.cloudinary.com/cwtolx7o/image/upload/v1786062107/DM7-SOLOQ-VALO_peode9.webp" class="w-36 h-36">
      <div class="flex-col flex justify-end">
      <h1 id="titleText" class="font-black text-[42px] tracking-[0.5px] leading-none uppercase">SoloQ Challenge</h1>
      <div class="text-[#38c98e] text-[13px] mt-2 font-semibold">Última actualización: <span id="lastUpdate">Cargando...</span></div>
      </div>
    </div>
    <div class="bg-zinc-800/20 backdrop-blur-md border border-line rounded-[10px] px-[18px] py-3 text-center">
      <div class="text-[10px] tracking-[2px] text-[#38c98e] font-bold">EL CHALLENGE TERMINA EN</div>
      <div class="text-[22px] font-bold text-white mt-0.5" id="countdownVal">25d 02h 38m 19s</div>
    </div>
  </header>

  <div id="podium" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-9"></div>

  <div class="hidden mb-4 flex flex-col md:flex-row gap-4 justify-between items-center">
    <input 
      type="text" 
      id="searchInput" 
      placeholder="Buscar participante por Riot ID..." 
      oninput="handleSearch()"
      class="w-full md:w-96 bg-black/30 border border-line rounded-lg px-4 py-2.5 text-sm text-ink focus:outline-none focus:border-valRed transition"
    />
  </div>

  <div class="overflow-x-auto">
    <table id="table" class="w-full border-collapse min-w-[760px]">
      <thead>
        <tr class="border-b border-line text-dim text-[12px] font-bold tracking-[1.5px]  font-black">
          <th class="text-left px-4 py-3.5 w-12">#</th>
          <th class="text-left px-4 py-3.5 font-black">Jugador</th>
          <th class="text-left px-4 py-3.5" data-sort-key="elo">
            <button type="button" onclick="toggleSort('elo')" class="inline-flex items-center gap-1.5 hover:text-ink transition font-black">
              Rango / ELO <span data-arrow-for="elo"></span>
            </button>
          </th>
          <th class="text-left px-4 py-3.5" data-sort-key="winrate">
            <button type="button" onclick="toggleSort('winrate')" class="inline-flex items-center gap-1.5 hover:text-ink transition font-black">
              V / D (Winrate) <span data-arrow-for="winrate"></span>
            </button>
          </th>
          <th class="text-left px-4 py-3.5" data-sort-key="kd">
            <button type="button" onclick="toggleSort('kd')" class="inline-flex items-center gap-1.5 hover:text-ink transition font-black">
              K/D <span data-arrow-for="kd"></span>
            </button>
          </th>
          <th class="text-left px-4 py-3.5" data-sort-key="hs">
            <button type="button" onclick="toggleSort('hs')" class="inline-flex items-center gap-1.5 hover:text-ink transition font-black">
              HS % <span data-arrow-for="hs"></span>
            </button>
          </th>
          <th class="text-left px-4 py-3.5 font-black">Rachas</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>


  <div id="emptyState" class="text-center py-16 px-5 text-dim">
    <b class="block text-ink font-bold text-lg mb-1.5">Cargando estadísticas de Valorant...</b>
  </div>

</div>

<script>
let rawPlayersData = [];
let sortState = { key: 'elo', dir: 'desc' };

function initials(name){ return (name||'?').trim().slice(0,2).toUpperCase(); }

function avatarHTML(p, sizeClasses){
  if (p.cardImage) {
    return `<img src="${p.cardImage}" class="${sizeClasses} rounded-full flex-shrink-0 object-cover border-2 border-line" onerror="this.outerHTML='<div class=\\'${sizeClasses} rounded-full flex-shrink-0 flex items-center justify-center font-bold bg-[#2a2a38] text-white border-2 border-line\\'>${initials(p.name)}</div>'">`;
  }
  return `<div class="${sizeClasses} rounded-full flex-shrink-0 flex items-center justify-center font-bold bg-[#2a2a38] text-white border-2 border-line">${initials(p.name)}</div>`;
}

function crestSVG(rank){
  if(rank===1) return `<svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M2 8L6 11L12 4L18 11L22 8L20 18H4L2 8Z" fill="#f2c14e"/></svg>`;
  if(rank===2) return `<svg width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="10" r="7" fill="#c7d0da"/><path d="M9 16L7 22L12 19L17 22L15 16" fill="#c7d0da"/></svg>`;
  return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="10" r="7" fill="#d9884b"/><path d="M9 16L7 22L12 19L17 22L15 16" fill="#d9884b"/></svg>`;
}

function renderMatchesBadge(matches) {
  if (!matches || matches.length === 0) {
    return `<span class="text-xs text-dim italic">sin partidas</span>`;
  }

  const svgWidth = 90;
  const svgHeight = 32;
  const paddingX = 5;
  const paddingY = 6;
  const usableWidth = svgWidth - (paddingX * 2);
  const total = matches.length;
  const stepX = total > 1 ? usableWidth / (total - 1) : 0;

  let wins = 0;
  let losses = 0;

  let currY = 16;
  let points = [{ x: paddingX, y: currY }];

  matches.forEach((m, idx) => {
    const isWin = m.won || m.result === 'Victoria';
    if (isWin) wins++; else losses++;

    if (idx > 0) {
      currY += isWin ? -5 : 5;
      currY = Math.max(paddingY, Math.min(svgHeight - paddingY, currY));
      points.push({ x: paddingX + idx * stepX, y: currY });
    }
  });

  const isPositive = wins >= losses;
  const color = isPositive ? '#38c98e' : '#ef5761';
  const gradientId = `grad-${Math.random().toString(36).substr(2, 7)}`;

  const polylinePoints = points.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const firstP = points[0];
  const lastP = points[points.length - 1];
  const areaPoints = `${firstP.x.toFixed(1)},${svgHeight} ${polylinePoints} ${lastP.x.toFixed(1)},${svgHeight}`;

  return `
    <div class="inline-flex items-center justify-center px-2 py-1" title="${wins}V - ${losses}D (${matches.length} partidas)">
      <svg width="${svgWidth}" height="${svgHeight}" style="overflow: visible;">
        <defs>
          <linearGradient id="${gradientId}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${color}" stop-opacity="0.4" />
            <stop offset="100%" stop-color="${color}" stop-opacity="0.0" />
          </linearGradient>
        </defs>
        <polygon points="${areaPoints}" fill="url(#${gradientId})" />
        <polyline
          fill="none"
          stroke="${color}"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          points="${polylinePoints}"
          style="filter: drop-shadow(0px 0px 3px ${color}80);"
        />
        <circle cx="${lastP.x.toFixed(1)}" cy="${lastP.y.toFixed(1)}" r="3" fill="${color}" stroke="#08080b" stroke-width="1.5" />
      </svg>
    </div>
  `;
}

function renderPodium(players) {
  const podium = document.getElementById('podium');
  podium.innerHTML = '';
  const rankOrderClass = { 1: 'order-2', 2: 'order-1', 3: 'order-3' };

  players.slice(0, 3).forEach((p, idx) => {
    const rank = idx + 1;
    const wr = p.stats?.winrate || p.stats?.winRate || 0;
    const wins = p.stats?.wins || 0;
    const losses = p.stats?.losses || 0;
    const total = p.stats?.totalMatches || (wins + losses);

    const div = document.createElement('div');
    div.className = `relative overflow-hidden backdrop-blur-md bg-black/25 border rounded-2xl p-[22px] md:${rankOrderClass[rank]} ` +
      (rank === 1
        ? 'border-gold/40 before:content-[\'\'] before:absolute before:inset-0 before:bg-[radial-gradient(circle_at_50%_-20%,rgba(242,193,78,0.18),transparent_65%)] before:animate-glow before:pointer-events-none'
        : 'border-line');

    div.innerHTML = `
      <div class="flex items-center gap-3 mb-[18px] relative z-[1]">
        <div class="w-[34px] h-[34px] flex-shrink-0 flex items-center justify-center">${crestSVG(rank)}</div>
        ${avatarHTML(p, 'w-11 h-11 text-base')}
        <div>
          <div class="font-bold text-base">${p.name}</div>
          <div class="text-[11.5px] text-dim">#${p.tag}</div>
        </div>
      </div>
      <div class="flex items-center gap-3 justify-center">
        ${p.rankImage ? `<img src="${p.rankImage}" class="w-12 h-12 object-contain" alt="${p.rank}">` : ''}
        <div class="font-bold text-[34px] flex items-center gap-1.5 justify-center">${p.rr} <span class="text-sm text-dim font-semibold">RR</span></div>
      </div>
      <div class="text-center text-xs text-dim font-semibold uppercase tracking-wider mt-1">${p.rank}</div>
      <div class="flex gap-[22px] mt-4 relative z-[1] justify-between">
        <div><b class="block text-base">${wins}V ${losses}D</b><small class="text-dim text-[10.5px] tracking-[0.5px]">${total} PARTIDAS</small></div>
        <div class="text-right"><b class="block text-base">${wr}%</b><small class="text-dim text-[10.5px] tracking-[0.5px]">WINRATE</small></div>
      </div>
      <div class="flex items-center gap-1 w-full mt-3 h-[6px] relative z-[1]">
  <div class="h-full rounded-full border border-win/60 bg-win" style="width:${wr}%"></div>
  <div class="h-full rounded-full border border-loss/60 bg-loss" style="width:${100 - wr}%"></div>
</div>
    `;
    podium.appendChild(div);
  });
}

function renderTable(players) {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  players.forEach((p, idx) => {
    const rank = idx + 1;
    const rankColor = rank===1?'text-gold':rank===2?'text-silver':rank===3?'text-bronze':'text-dim';
    const wr = p.stats?.winrate || p.stats?.winRate || 0;
    const wins = p.stats?.wins || 0;
    const losses = p.stats?.losses || 0;

    const tr = document.createElement('tr');
    tr.className = 'hover:bg-white/5 transition';
    tr.innerHTML = `
      <td class="px-4 py-3.5 align-middle font-bold text-[15px] ${rankColor}">${rank}</td>
      <td class="px-4 py-3.5 align-middle">
        <div class="flex items-center gap-3">
          ${avatarHTML(p, 'w-9 h-9 text-xs')}
          <div>
            <div class="text-sm font-bold text-ink">${p.name}</div>
            <div class="text-[11px] text-dim">#${p.tag}</div>
          </div>
        </div>
      </td>
      <td class="px-4 py-3.5 align-middle">
        <div class="flex items-center gap-2.5">
          ${p.rankImage ? `<img src="${p.rankImage}" class="w-12 h-12 object-contain" alt="${p.rank}">` : ''}
          <div>
            <div class="font-bold text-[15px]">${p.rr} RR</div>
            <div class="text-[11px] text-dim font-medium capitalize">${p.rank}</div>
          </div>
        </div>
      </td>
      <td class="px-4 py-3.5 align-middle">
        <div>
          <b class="text-win font-bold italic text-[14px]">${wr}%</b>
          <span class="text-[11px] ml-1.5"><span class="text-win font-bold">${wins}V</span> <span class="text-dim">·</span> <span class="text-loss font-bold">${losses}D</span></span>
        </div>
        <div class="flex items-center gap-[3px] w-[130px] mt-1.5 h-[6px]">
          <div class="h-full rounded-full border border-win/60 bg-win" style="width:${wr}%"></div>
          <div class="h-full rounded-full border border-loss/60 bg-loss" style="width:${100 - wr}%"></div>
        </div>
      </td>
      <td class="px-4 py-3.5 align-middle font-bold text-sm">${p.stats?.kd || '0.00'}</td>
      <td class="px-4 py-3.5 align-middle font-bold text-sm">${p.stats?.headshotPct || p.stats?.hs || 0}%</td>
      <td class="px-4 py-3.5 align-middle">${renderMatchesBadge(p.matches)}</td>
    `;
    tbody.appendChild(tr);
  });
}

function getElo(p) {
  return p.elo !== undefined ? p.elo : ((p.tier || 0) * 100 + (p.rr || 0));
}

function processAndRender() {
  let list = [...rawPlayersData];

  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  if (query) {
    list = list.filter(p => p.name.toLowerCase().includes(query) || p.tag.toLowerCase().includes(query));
  }

  const podiumList = [...list].sort((a, b) => getElo(b) - getElo(a));

  const tableList = [...list];
  const { key, dir } = sortState;
  const mult = dir === 'asc' ? 1 : -1;
  tableList.sort((a, b) => {
    let valA, valB;
    if (key === 'elo') {
      valA = getElo(a);
      valB = getElo(b);
    } else if (key === 'winrate') {
      valA = a.stats?.winrate ?? a.stats?.winRate ?? 0;
      valB = b.stats?.winrate ?? b.stats?.winRate ?? 0;
    } else if (key === 'kd') {
      valA = parseFloat(a.stats?.kd || 0);
      valB = parseFloat(b.stats?.kd || 0);
    } else if (key === 'hs') {
      valA = a.stats?.headshotPct ?? a.stats?.hs ?? 0;
      valB = b.stats?.headshotPct ?? b.stats?.hs ?? 0;
    } else {
      valA = 0;
      valB = 0;
    }
    return (valA - valB) * mult;
  });

  renderSortArrows();

  if (list.length === 0) {
    document.getElementById('table').style.display = 'none';
    document.getElementById('emptyState').innerHTML = '<b class="block text-ink font-bold text-lg">No se encontraron participantes.</b>';
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('podium').innerHTML = '';
  } else {
    document.getElementById('table').style.display = 'table';
    document.getElementById('emptyState').style.display = 'none';
    renderPodium(podiumList);
    renderTable(tableList);
  }
}

function handleSearch() { processAndRender(); }

function toggleSort(key) {
  if (sortState.key === key) {
    sortState.dir = sortState.dir === 'desc' ? 'asc' : 'desc';
  } else {
    sortState = { key, dir: 'desc' };
  }
  processAndRender();
}

function renderSortArrows() {
  document.querySelectorAll('[data-arrow-for]').forEach(el => {
    const key = el.getAttribute('data-arrow-for');
    const isActive = sortState.key === key;
    const upActive = isActive && sortState.dir === 'asc';
    const downActive = isActive && sortState.dir === 'desc';
    el.innerHTML = `
      <span class="inline-flex flex-col gap-[3px] justify-center">
        <svg width="8" height="5" viewBox="0 0 8 5" class="${upActive ? 'fill-valRed' : 'fill-dim/40'} transition-colors">
          <path d="M4 0L8 5H0L4 0Z"/>
        </svg>
        <svg width="8" height="5" viewBox="0 0 8 5" class="${downActive ? 'fill-valRed' : 'fill-dim/40'} transition-colors">
          <path d="M4 5L0 0H8L4 5Z"/>
        </svg>
      </span>
    `;
  });
}

async function loadData() {
  try {
    const res = await fetch('/api/stats');
    if(!res.ok) throw new Error('Error al conectar con la API');

    const data = await res.json();
    rawPlayersData = data.players || [];

    if (data.updatedAt) {
      const date = new Date(data.updatedAt);
      document.getElementById('lastUpdate').textContent = date.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
    }

    processAndRender();
  } catch (err) {
    console.error(err);
    document.getElementById('emptyState').innerHTML = '<b class="block text-valRed font-bold text-lg mb-1">Ocurrió un problema cargando los datos</b>Comprueba si el servidor respondió correctamente.';
  }
}

loadData();
</script>
</body>
</html>

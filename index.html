<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SoloQ Challenge - Valorant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Montserrat"', 'sans-serif'] },
          colors: {
            bg: '#08080b', panel: '#0f0f15', panel2: '#131319', line: '#1e1e27',
            ink: '#f2f2f5', dim: '#8b8b96',
            gold: '#f2c14e', silver: '#c7d0da', bronze: '#d9884b',
            purple: '#8b6ef2', win: '#38c98e', loss: '#ef5761', valRed: '#ff4655'
          },
          keyframes: {
            glow: { '0%,100%': { opacity: 0.6 }, '50%': { opacity: 1 } },
          },
          animation: {
            glow: 'glow 3.5s ease-in-out infinite',
          },
        },
      },
    };
  </script>
</head>
<body
  class="min-h-screen font-sans text-ink px-5 pt-7 pb-16 bg-cover bg-center bg-fixed"
  style="
    background-color: #08080b;
    background-image: url('https://soloqchallenge.gg/assets/bg_home-GdTbtqNt.webp');
  ">
<div class="max-w-[1180px] mx-auto">

  <header class="flex items-end justify-between flex-wrap gap-4 mb-8 pb-5 border-b border-line">
    <div>
      <div class="text-[11px] tracking-[3px] text-valRed uppercase mb-1.5 font-bold">VALORANT · LAS COMPETITIVE GRIND</div>
      <h1 id="titleText" class="font-black text-[42px] tracking-[0.5px] leading-none uppercase">SoloQ Challenge</h1>
      <div class="text-white/55 text-[13px] mt-2 font-semibold">Última actualización: <span id="lastUpdate">Cargando...</span></div>
    </div>
    <div class="bg-zinc-800/20 backdrop-blur-md border border-line rounded-[10px] px-[18px] py-3 text-center">
      <div class="text-[10px] tracking-[2px] text-dim font-bold">EL CHALLENGE TERMINA EN</div>
      <div class="text-[22px] font-bold text-gold mt-0.5" id="countdownVal">25d 02h 38m 19s</div>
    </div>
  </header>

  <div id="podium" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-9"></div>

  <div class="bg-panel/80 backdrop-blur-md border border-line rounded-xl p-4 mb-4 flex flex-col md:flex-row gap-4 justify-between items-center">
    <input 
      type="text" 
      id="searchInput" 
      placeholder="Buscar participante por Riot ID..." 
      oninput="handleSearch()"
      class="w-full md:w-96 bg-black/40 border border-line rounded-lg px-4 py-2.5 text-sm text-ink focus:outline-none focus:border-valRed transition"
    />
    <div class="flex items-center gap-3 w-full md:w-auto justify-end">
      <span class="text-xs text-dim font-semibold uppercase tracking-wider">Ordenar por:</span>
      <select id="sortSelect" onchange="handleSortChange()" class="bg-black/40 border border-line rounded-lg px-3 py-2 text-sm text-ink focus:outline-none">
        <option value="rr-desc">Posición (RR / Rango)</option>
        <option value="winrate-desc">Winrate (%)</option>
        <option value="kd-desc">K/D Ratio</option>
        <option value="hs-desc">HS %</option>
        <option value="name-asc">Nombre (A-Z)</option>
      </select>
    </div>
  </div>

  <div class="rounded-xl overflow-hidden overflow-x-auto border border-line bg-panel/60 backdrop-blur-md">
    <table id="table" class="w-full border-collapse min-w-[760px]">
      <thead>
        <tr class="border-b border-line text-dim text-[11px] font-bold tracking-[1.5px] uppercase">
          <th class="text-left px-4 py-3.5 w-12">#</th>
          <th class="text-left px-4 py-3.5">Jugador</th>
          <th class="text-left px-4 py-3.5">Rango / ELO</th>
          <th class="text-left px-4 py-3.5">V / D (Winrate)</th>
          <th class="text-left px-4 py-3.5">K/D</th>
          <th class="text-left px-4 py-3.5">HS %</th>
          <th class="text-left px-4 py-3.5">Últimas Partidas</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div id="emptyState" class="text-center py-16 px-5 text-dim">
    <b class="block text-ink font-bold text-lg mb-1.5">Cargando estadísticas de Valorant...</b>
  </div>

</div>

<script>
let rawPlayersData = [];

function initials(name){ return (name||'?').trim().slice(0,2).toUpperCase(); }

function crestSVG(rank){
  if(rank===1) return `<svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M2 8L6 11L12 4L18 11L22 8L20 18H4L2 8Z" fill="#f2c14e"/></svg>`;
  if(rank===2) return `<svg width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="10" r="7" fill="#c7d0da"/><path d="M9 16L7 22L12 19L17 22L15 16" fill="#c7d0da"/></svg>`;
  return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="10" r="7" fill="#d9884b"/><path d="M9 16L7 22L12 19L17 22L15 16" fill="#d9884b"/></svg>`;
}

function renderMatchesBadge(matches) {
  if (!matches || matches.length === 0) {
    return `<span class="text-xs text-dim italic">sin partidas</span>`;
  }

  // 1. Puntos para trazar la línea Stonks
  let points = [];
  let currentY = 20;
  const total = matches.length;
  const xStep = total > 1 ? 80 / (total - 1) : 0;

  matches.forEach((game, index) => {
    if (game.won || game.result === 'Victoria') currentY -= 6; // Sube
    else currentY += 6;                                        // Baja
    currentY = Math.max(6, Math.min(34, currentY));
    points.push(`${10 + index * xStep},${currentY}`);
  });

  const lastGameWon = matches[matches.length - 1]?.won || matches[matches.length - 1]?.result === 'Victoria';
  const strokeColor = lastGameWon ? '#38c98e' : '#ef5761';

  // 2. Barras de Victoria (V) / Derrota (D)
  const barsHTML = matches.map(m => {
    const isWin = m.won || m.result === 'Victoria';
    const bg = isWin ? 'rgba(56, 201, 142, 0.2)' : 'rgba(239, 87, 97, 0.2)';
    const border = isWin ? '#38c98e' : '#ef5761';
    const label = isWin ? 'V' : 'D';

    return `
      <div title="${m.map || 'Competitivo'} (${m.kda || '0.00'} KDA)" 
           style="
              width: 16px; 
              height: 28px; 
              background: ${bg}; 
              border: 1px solid ${border}; 
              border-radius: 4px; 
              display: flex; 
              align-items: center; 
              justify-content: center; 
              font-size: 10px; 
              font-weight: 800; 
              color: ${border};
              z-index: 10;
           ">
          ${label}
      </div>
    `;
  }).join('');

  // 3. Superposición de barras y trazado SVG Stonks
  return `
    <div style="position: relative; display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; background: rgba(0,0,0,0.4); border-radius: 8px; border: 1px solid #1e1e27;">
      ${barsHTML}
      <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20;">
        <polyline
          fill="none"
          stroke="${strokeColor}"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          points="${points.join(' ')}"
          style="filter: drop-shadow(0px 0px 4px ${strokeColor});"
        />
      </svg>
    </div>
  `;
}

function renderPodium(players) {
  const podium = document.getElementById('podium');
  podium.innerHTML = '';
  const rankOrderClass = { 1: 'order-2', 2: 'order-1', 3: 'order-3' };

  players.slice(0, 3).forEach((p, idx) => {
    const rank = idx + 1;
    const wr = p.stats?.winrate || p.stats?.winRate || 0;
    const wins = p.stats?.wins || 0;
    const losses = p.stats?.losses || 0;
    const total = p.stats?.totalMatches || (wins + losses);

    const div = document.createElement('div');
    div.className = `relative overflow-hidden bg-gradient-to-b from-panel2 to-panel border rounded-2xl p-[22px] md:${rankOrderClass[rank]} ` +
      (rank === 1
        ? 'border-gold/40 before:content-[\'\'] before:absolute before:inset-0 before:bg-[radial-gradient(circle_at_50%_-20%,rgba(242,193,78,0.18),transparent_65%)] before:animate-glow before:pointer-events-none'
        : 'border-line');

    div.innerHTML = `
      <div class="flex items-center gap-3 mb-[18px] relative z-[1]">
        <div class="w-[34px] h-[34px] flex-shrink-0 flex items-center justify-center">${crestSVG(rank)}</div>
        <div class="w-11 h-11 rounded-full flex-shrink-0 flex items-center justify-center font-bold text-base bg-[#2a2a38] text-white border-2 border-line">${initials(p.name)}</div>
        <div>
          <div class="font-bold text-base">${p.name}</div>
          <div class="text-[11.5px] text-dim">#${p.tag}</div>
        </div>
      </div>
      <div class="flex items-center gap-3 justify-center">
        ${p.rankImage ? `<img src="${p.rankImage}" class="w-12 h-12 object-contain" alt="${p.rank}">` : ''}
        <div class="font-bold text-[34px] flex items-center gap-1.5 justify-center">${p.rr} <span class="text-sm text-dim font-semibold">RR</span></div>
      </div>
      <div class="text-center text-xs text-dim font-semibold uppercase tracking-wider mt-1">${p.rank}</div>
      <div class="flex gap-[22px] mt-4 relative z-[1] justify-between">
        <div><b class="block text-base">${wins}V ${losses}D</b><small class="text-dim text-[10.5px] tracking-[0.5px]">${total} PARTIDAS</small></div>
        <div class="text-right"><b class="block text-base">${wr}%</b><small class="text-dim text-[10.5px] tracking-[0.5px]">WINRATE</small></div>
      </div>
      <div class="h-[5px] rounded-[3px] overflow-hidden flex mt-3 bg-loss relative z-[1]"><i class="block h-full bg-win" style="width:${wr}%"></i></div>
    `;
    podium.appendChild(div);
  });
}

function renderTable(players) {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  players.forEach((p, idx) => {
    const rank = idx + 1;
    const rankColor = rank===1?'text-gold':rank===2?'text-silver':rank===3?'text-bronze':'text-dim';
    const wr = p.stats?.winrate || p.stats?.winRate || 0;
    const wins = p.stats?.wins || 0;
    const losses = p.stats?.losses || 0;

    const tr = document.createElement('tr');
    tr.className = 'hover:bg-white/[0.02] border-b border-line/50 transition';
    tr.innerHTML = `
      <td class="px-4 py-4 align-middle font-bold text-[15px] ${rankColor}">${rank}</td>
      <td class="px-4 py-4 align-middle">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full flex-shrink-0 flex items-center justify-center font-bold text-xs text-white bg-zinc-800 border border-line">${initials(p.name)}</div>
          <div>
            <div class="text-sm font-bold text-ink">${p.name}</div>
            <div class="text-[11px] text-dim">#${p.tag}</div>
          </div>
        </div>
      </td>
      <td class="px-4 py-4 align-middle">
        <div class="flex items-center gap-2.5">
          ${p.rankImage ? `<img src="${p.rankImage}" class="w-8 h-8 object-contain" alt="${p.rank}">` : ''}
          <div>
            <div class="font-bold text-[15px]">${p.rr} RR</div>
            <div class="text-[11px] text-dim font-medium capitalize">${p.rank}</div>
          </div>
        </div>
      </td>
      <td class="px-4 py-4 align-middle">
        <div>
          <b class="text-win font-bold italic text-[14px]">${wr}%</b>
          <span class="text-[11px] ml-1.5"><span class="text-win font-bold">${wins}V</span> <span class="text-dim">•</span> <span class="text-loss font-bold">${losses}D</span></span>
        </div>
        <div class="flex items-center w-[120px] mt-1.5 h-[4px] bg-loss rounded-full overflow-hidden">
          <div class="h-full bg-win" style="width:${wr}%"></div>
        </div>
      </td>
      <td class="px-4 py-4 align-middle font-bold text-sm">${p.stats?.kd || '0.00'}</td>
      <td class="px-4 py-4 align-middle font-bold text-sm text-purple">${p.stats?.headshotPct || p.stats?.hs || 0}%</td>
      <td class="px-4 py-4 align-middle">${renderMatchesBadge(p.matches)}</td>
    `;
    tbody.appendChild(tr);
  });
}

function processAndRender() {
  let list = [...rawPlayersData];

  // Búsqueda
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  if (query) {
    list = list.filter(p => p.name.toLowerCase().includes(query) || p.tag.toLowerCase().includes(query));
  }

  // Ordenamiento
  const sortVal = document.getElementById('sortSelect').value;
  list.sort((a, b) => {
    if (sortVal === 'rr-desc') return (b.rr || 0) - (a.rr || 0);
    if (sortVal === 'winrate-desc') return ((b.stats?.winrate || b.stats?.winRate || 0) - (a.stats?.winrate || a.stats?.winRate || 0));
    if (sortVal === 'kd-desc') return parseFloat(b.stats?.kd || 0) - parseFloat(a.stats?.kd || 0);
    if (sortVal === 'hs-desc') return (b.stats?.headshotPct || 0) - (a.stats?.headshotPct || 0);
    if (sortVal === 'name-asc') return a.name.localeCompare(b.name);
    return 0;
  });

  if (list.length === 0) {
    document.getElementById('table').style.display = 'none';
    document.getElementById('emptyState').innerHTML = '<b class="block text-ink font-bold text-lg">No se encontraron participantes.</b>';
    document.getElementById('emptyState').style.display = 'block';
  } else {
    document.getElementById('table').style.display = 'table';
    document.getElementById('emptyState').style.display = 'none';
    renderPodium(list);
    renderTable(list);
  }
}

function handleSearch() { processAndRender(); }
function handleSortChange() { processAndRender(); }

// Cargar datos desde la API Vercel
async function loadData() {
  try {
    const res = await fetch('/api/stats');
    if(!res.ok) throw new Error('Error al conectar con la API');
    
    const data = await res.json();
    rawPlayersData = data.players || [];

    if (data.updatedAt) {
      const date = new Date(data.updatedAt);
      document.getElementById('lastUpdate').textContent = date.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
    }

    processAndRender();
  } catch (err) {
    console.error(err);
    document.getElementById('emptyState').innerHTML = '<b class="block text-valRed font-bold text-lg mb-1">Ocurrió un problema cargando los datos</b>Revisa si la API de HenrikDev respondió o si estás en límite de peticiones.';
  }
}

loadData();
</script>
</body>
</html>
